# 前缀 location 共用代理配置（静态文件，envsubst 不处理——内含的 $ 变量原样生效）
# 供 manage-upstreams.sh 生成的 location include；默认 location 保持模板内联配置不变

# 透传认证与真实客户端信息（Host 必传，否则上游日志里 Host 变成 upstream 名，排障困惑）
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_pass_request_headers on;

# 只读代理：仅允许 GET/HEAD（与默认 location 行为一致，禁止推送）
limit_except GET HEAD {
    deny all;
}

# 超时配置（镜像层下载可能需要较长时间）
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# 大文件流式传输
proxy_buffering off;
proxy_request_buffering off;

proxy_http_version 1.1;
proxy_set_header Connection "";
